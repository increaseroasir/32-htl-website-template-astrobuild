# Cloudflare WORKERS config (@astrojs/cloudflare v13 dropped Pages support).
#
# Contains no secrets. Values here are bindings and non-sensitive vars only.
# Secrets are set with:  wrangler secret put NAME
#
# Per-client values marked TODO are filled in when a client site is set up.

name = "htl-website-template"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# --- D1: inventory / products / leads (Phase 3) ---
# [[d1_databases]]
# binding = "DB"                  # the name src/lib/db.ts expects — do not rename
# database_name = "TODO-client-inventory"
# database_id = "TODO-run: wrangler d1 create <name>"
# migrations_dir = "db/migrations"  # REQUIRED — uncomment with the block above.
#                                   # Schema changes are new files in db/migrations/,
#                                   # applied with npm run db:migrate:local|remote.
#                                   # Never edit db/schema.sql to change a live DB.

# --- R2: product images (Phase 6) ---
# [[r2_buckets]]
# binding = "PRODUCT_IMAGES"      # the name the code expects — do not rename
# bucket_name = "TODO-client-product-images"

[vars]
# Non-secret, public-safe values only.
# PUBLIC_SENTRY_DSN = "TODO"

# Secrets — DO NOT put these in this file:
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put ADMIN_SESSION_SECRET
#   wrangler secret put GHL_API_KEY
#   wrangler secret put META_CAPI_ACCESS_TOKEN
